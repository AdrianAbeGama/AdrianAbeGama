<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">
<style>
.ap{opacity:0;animation:ap .5s cubic-bezier(.2,.8,.2,1) forwards}
.sube{opacity:0;transform:translateY(14px);animation:sube .6s cubic-bezier(.2,.8,.2,1) forwards}
.cursor{animation:parpadeo 1.1s steps(1) infinite}
.pulso{animation:pulso 2s ease-in-out infinite}
.px{opacity:0;animation:ap .08s forwards}
@keyframes ap{to{opacity:1}}
@keyframes sube{to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
@keyframes pulso{50%{opacity:.35}}

</style>
<defs>
  <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#16213a"/></pattern>
  <radialGradient id="luz" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#4d9fff" stop-opacity=".14"/><stop offset="1" stop-color="#4d9fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="18" fill="#070b14"/>
<rect width="1200" height="300" rx="18" fill="url(#puntos)"/>
<rect width="1200" height="300" rx="18" fill="url(#luz)"/>
<rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#1e2a3d" stroke-width="2"/>
<circle cx="34" cy="34" r="7" fill="#ff5f57"/><circle cx="58" cy="34" r="7" fill="#febc2e"/><circle cx="82" cy="34" r="7" fill="#28c840"/>
<text x="108" y="40" font-size="18" fill="#5a6880">~ — zsh</text>
<text x="1168" y="40" font-size="18" fill="#5a6880" text-anchor="end">DCG Triak · Arequipa, Perú</text>
<line x1="2" y1="64" x2="1198" y2="64" stroke="#1e2a3d" stroke-width="2"/><text class="ap" style="animation-delay:0.30s" x="48" y="110" font-size="21"><tspan fill="#4d9fff">$</tspan> <tspan fill="#e8eef7">./contratar.sh --dev adrian</tspan></text><text class="ap" style="animation-delay:1.10s" x="48" y="146" font-size="21"><tspan fill="#94a0b4">&gt; conectando con adrian@abegama ......</tspan> <tspan fill="#39d353">[ OK ]</tspan></text><text class="ap" style="animation-delay:1.60s" x="48" y="182" font-size="21"><tspan fill="#94a0b4">&gt; estado</tspan><tspan x="230" fill="#39d353">● disponible para proyectos</tspan></text><text class="ap" style="animation-delay:2.00s" x="48" y="218" font-size="21"><tspan fill="#94a0b4">&gt; hago</tspan><tspan x="230" fill="#e8eef7">apps · tiendas online · paneles · sistemas a medida</tspan></text><text class="ap" style="animation-delay:2.40s" x="48" y="254" font-size="21"><tspan fill="#94a0b4">&gt; portafolio</tspan><tspan x="230" fill="#4d9fff" text-decoration="underline">portafoliogama.vercel.app</tspan></text><rect class="ap" style="animation:ap .1s 2.8s forwards, parpadeo 1.1s steps(1) 2.9s infinite" x="48" y="272" width="12" height="22" fill="#4d9fff"/>
</svg>