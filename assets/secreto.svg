<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" font-family="Consolas, 'Cascadia Mono', 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">
<style>
.ap{opacity:0;animation:ap .5s cubic-bezier(.2,.8,.2,1) forwards}
.sube{opacity:0;transform:translateY(14px);animation:sube .6s cubic-bezier(.2,.8,.2,1) forwards}
.cursor{animation:parpadeo 1.1s steps(1) infinite}
.pulso{animation:pulso 2s ease-in-out infinite}
.px{opacity:0;animation:ap .08s forwards}
@keyframes ap{to{opacity:1}}
@keyframes sube{to{opacity:1;transform:none}}
@keyframes parpadeo{50%{opacity:0}}
@keyframes pulso{50%{opacity:.35}}

</style>
<defs>
  <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#16213a"/></pattern>
  <radialGradient id="luz" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#4d9fff" stop-opacity=".14"/><stop offset="1" stop-color="#4d9fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="170" rx="18" fill="#070b14"/>
<rect width="1200" height="170" rx="18" fill="url(#puntos)"/>
<rect width="1200" height="170" rx="18" fill="url(#luz)"/>
<rect x="1" y="1" width="1198" height="168" rx="17" fill="none" stroke="#1e2a3d" stroke-width="2"/>
<g class="sube" style="animation-delay:0.20s">
<rect x="150" y="30" width="900" height="110" rx="14" fill="#101827" stroke="#4d9fff" stroke-width="1.5"/>
<rect x="176" y="55" width="60" height="60" rx="12" fill="#10213a" stroke="#4d9fff" stroke-width="1.5"/>
<path d="M195 71h22v10a11 11 0 0 1-22 0zM195 75h-6a5 5 0 0 0 6 8M217 75h6a5 5 0 0 1-6 8M206 92v7M198 102h16" fill="none" stroke="#ffb142" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="70" font-size="15" fill="#4d9fff" letter-spacing="3">★ LOGRO SECRETO · ACH 10/10</text>
<text x="262" y="102" font-size="24" fill="#e8eef7" font-weight="bold">Leíste hasta el final</text>
<text x="262" y="126" font-size="16" fill="#94a0b4">Te debo un café. Escríbeme: portafoliogama.vercel.app</text></g>
</svg>